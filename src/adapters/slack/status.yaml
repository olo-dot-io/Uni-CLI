site: slack
name: status
description: Check Slack authentication through the official Slack Web API
domain: slack.com
type: web-api
strategy: public

args:
  token:
    type: str
    description: Slack token, or set SLACK_TOKEN

pipeline:
  - fetch:
      url: https://slack.com/api/auth.test
      headers:
        Authorization: "${{ 'Bearer ' + (args.token || env.SLACK_TOKEN || '') }}"

columns: [ok, url, team, user, team_id, user_id, bot_id]
operation_effect: read
execution_operator: structured-api
operation_family: get
auth_requirement: required
capabilities: [http.fetch]
minimum_capability: http.fetch
trust: user
confidentiality: private
quarantine: false
schema_version: v2
