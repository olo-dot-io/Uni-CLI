site: slack
name: channels
description: List Slack channels through the official Slack Web API
domain: slack.com
type: web-api
strategy: public

args:
  token:
    type: str
    description: Slack token, or set SLACK_TOKEN
  limit:
    type: int
    default: 100
    minimum: 1
    maximum: 200
    description: Number of channels

pipeline:
  - fetch:
      url: https://slack.com/api/conversations.list
      headers:
        Authorization: "${{ 'Bearer ' + (args.token || env.SLACK_TOKEN || '') }}"
      params:
        limit: "${{ args.limit }}"

  - select: channels

columns: [id, name, is_private, num_members]
operation_effect: read
execution_operator: structured-api
operation_family: list
auth_requirement: required
capabilities: [http.fetch]
minimum_capability: http.fetch
trust: user
confidentiality: private
quarantine: false
schema_version: v2
