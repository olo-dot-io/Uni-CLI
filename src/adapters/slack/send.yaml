site: slack
name: send
description: Send a Slack message through the official Slack Web API
domain: slack.com
type: web-api
strategy: public

args:
  channel:
    type: str
    required: true
    positional: true
    description: Slack channel ID
  text:
    type: str
    required: true
    positional: true
    minLength: 1
    description: Message text
  token:
    type: str
    description: Slack bot or user token, or set SLACK_TOKEN

pipeline:
  - fetch:
      url: https://slack.com/api/chat.postMessage
      method: POST
      headers:
        Authorization: "${{ 'Bearer ' + (args.token || env.SLACK_TOKEN || '') }}"
        Content-Type: application/json; charset=utf-8
      body:
        channel: "${{ args.channel }}"
        text: "${{ args.text }}"

columns: [ok, channel, ts, message]
operation_effect: send_message
execution_operator: structured-api
operation_family: create
idempotency: none
auth_requirement: required
capabilities: [http.fetch]
minimum_capability: http.fetch
trust: user
confidentiality: private
quarantine: false
schema_version: v2
