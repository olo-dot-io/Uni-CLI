site: slack
name: search
description: Search Slack messages through the official Slack Web API
domain: slack.com
type: web-api
strategy: public
lint_listing_detail: skip

args:
  query:
    type: str
    required: true
    positional: true
    description: Slack message search query
  token:
    type: str
    description: Slack user token, or set SLACK_TOKEN
  limit:
    type: int
    default: 20
    minimum: 1
    maximum: 100
    description: Number of messages

pipeline:
  - fetch:
      url: https://slack.com/api/search.messages
      headers:
        Authorization: "${{ 'Bearer ' + (args.token || env.SLACK_TOKEN || '') }}"
      params:
        query: "${{ args.query }}"
        count: "${{ args.limit }}"

  - select: messages.matches

columns: [channel_id, username, text, ts, permalink]
operation_effect: read
execution_operator: structured-api
operation_family: search
auth_requirement: required
retrieval:
  operation: discover
  result_kind: message
  source_class: official
  arguments:
    query: query
    limit: limit
capabilities: [http.fetch]
minimum_capability: http.fetch
trust: user
confidentiality: private
quarantine: false
schema_version: v2
