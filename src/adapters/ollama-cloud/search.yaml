site: ollama-cloud
name: search
description: Search the web through Ollama Cloud web_search
operation_effect: read
execution_operator: structured-api
operation_family: search
idempotency: guaranteed
target_surface: web
type: web-api
domain: ollama.com
strategy: environment
auth_requirement: required
availability:
  environment: [OLLAMA_API_KEY]
  discovery: configured

args:
  query:
    type: str
    required: true
    positional: true
    description: Web search query
  limit:
    type: int
    default: 5
    minimum: 1
    maximum: 20
    description: Maximum number of results to return

pipeline:
  - fetch:
      url: https://ollama.com/api/web_search
      method: POST
      headers:
        Accept: "application/json"
        Authorization: "Bearer ${{ env.OLLAMA_API_KEY }}"
      body:
        query: "${{ args.query }}"
  - select: results
  - map:
      title: "${{ item.title || '' }}"
      url: "${{ item.url || '' }}"
      content: "${{ item.content || '' }}"
  - limit: ${{ args.limit }}

columns: [title, url, content]

retrieval:
  operation: discover
  result_kind: docs
  source_class: search-index
  selection: explicit
  arguments:
    query: query
    limit: limit

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["http.fetch"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
