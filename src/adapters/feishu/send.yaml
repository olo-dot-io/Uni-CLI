site: feishu
name: send
description: Send a message via Feishu/Lark CLI
type: bridge
detect: which lark-cli
strategy: public
args:
  chat:
    required: true
    positional: true
    description: Chat ID or group name
  message:
    required: true
    description: Message content
pipeline:
  - exec:
      command: lark-cli
      args:
        [
          im,
          +messages-send,
          --chat-id,
          "${{ args.chat }}",
          --text,
          "${{ args.message }}",
          --as,
          user,
          --format,
          json,
        ]
      parse: json
      timeout: 30000

operation_effect: send_message
execution_operator: native-cli
operation_family: create
idempotency: none
auth_requirement: required
capabilities: ["subprocess.exec"]
executables: [lark-cli]
minimum_capability: subprocess.exec
trust: user
confidentiality: private
quarantine: false
schema_version: v2
