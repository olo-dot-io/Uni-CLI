site: feishu
name: tasks
description: List the current user's tasks through the official Lark/Feishu CLI
type: bridge
detect: which lark-cli
strategy: public
pipeline:
  - exec:
      command: lark-cli
      args: [task, +get-my-tasks, --as, user, --format, json]
      parse: json
      timeout: 60000

operation_effect: read
execution_operator: native-cli
operation_family: list
auth_requirement: required
capabilities: ["subprocess.exec"]
executables: [lark-cli]
minimum_capability: subprocess.exec
trust: user
confidentiality: private
quarantine: false
schema_version: v2
