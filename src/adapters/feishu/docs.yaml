site: feishu
name: docs
description: List recently edited documents through the official Lark/Feishu CLI
type: bridge
detect: which lark-cli
strategy: public
args:
  limit:
    type: int
    default: 20
    minimum: 1
    maximum: 20
    description: Number of documents
pipeline:
  - exec:
      command: lark-cli
      args:
        [
          drive,
          +search,
          --query,
          "",
          --doc-types,
          docx,
          --sort,
          edit_time,
          --page-size,
          "${{ args.limit }}",
          --as,
          user,
          --format,
          json,
        ]
      parse: json
      timeout: 60000

operation_effect: read
execution_operator: native-cli
operation_family: list
auth_requirement: required
capabilities: ["subprocess.exec"]
executables: [lark-cli]
minimum_capability: subprocess.exec
trust: user
confidentiality: private
quarantine: false
schema_version: v2
