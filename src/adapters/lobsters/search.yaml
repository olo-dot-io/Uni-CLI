site: lobsters
name: search
description: Search Lobsters stories
type: web-api
domain: lobste.rs
strategy: public
lint_listing_detail: skip

args:
  query:
    type: str
    required: true
    positional: true
  limit:
    type: int
    default: 20
  sort:
    type: str
    default: relevance
    choices: [relevance, newest, score]

pipeline:
  - fetch_text:
      url: https://lobste.rs/search
      params:
        q: "${{ args.query }}"
        what: stories
        order: "${{ args.sort }}"
      headers:
        Accept: text/html

  - extract:
      from: li.story
      fields:
        title:
          selector: a.u-url
        url:
          selector: a.u-url
          type: attribute
          attribute: href
        score:
          selector: .voters .upvoter
          type: number
        author:
          selector: ".byline > a:not([aria-hidden='true'])"
        comments:
          selector: .comments_label a
          type: number
        created_at:
          selector: time
          type: attribute
          attribute: data-at-unix
        tags:
          selector: .tags .tag
          multiple: true

  - limit: ${{ args.limit }}

columns: [title, score, author, comments, created_at, tags, url]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
retrieval:
  operation: discover
  result_kind: community
  source_class: community
  arguments:
    query: query
    limit: limit
    sort: sort
capabilities: ["http.fetch"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
