site: hf
name: models
description: Search live Hugging Face model metadata through the public Hub API
type: web-api
domain: huggingface.co
strategy: public

args:
  query:
    type: str
    required: true
    positional: true
    description: Model name, organization, tag, or free-text query
  limit:
    type: int
    default: 20
  sort:
    type: str
    default: lastModified
    choices: [lastModified, createdAt, downloads, likes]

pipeline:
  - fetch:
      url: https://huggingface.co/api/models
      params:
        search: "${{ args.query }}"
        limit: "${{ args.limit }}"
        sort: "${{ args.sort }}"
        direction: "-1"

  - map:
      id: ${{ item.id }}
      title: ${{ item.id }}
      author: "${{ item.author || item.id.split('/')[0] || '' }}"
      pipeline_tag: "${{ item.pipeline_tag || '' }}"
      downloads: "${{ item.downloads || 0 }}"
      likes: "${{ item.likes || 0 }}"
      createdAt: "${{ item.createdAt || '' }}"
      lastModified: "${{ item.lastModified || '' }}"
      tags: "${{ (item.tags || []).slice(0,8).join(', ') }}"
      url: "${{ 'https://huggingface.co/' + item.id }}"

  - limit: ${{ args.limit }}

columns: [id, author, pipeline_tag, downloads, likes, lastModified, url]

capabilities: ["http.fetch", "ai.search", "ai.artifacts"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
