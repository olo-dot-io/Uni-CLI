site: hf
name: datasets
description: Search Hugging Face datasets
type: web-api
domain: huggingface.co
strategy: public

args:
  query:
    type: str
    positional: true
    description: Search query
  limit:
    type: int
    default: 20
  sort:
    type: str
    default: lastModified
    choices: [lastModified, createdAt, downloads, likes]

pipeline:
  - fetch:
      url: https://huggingface.co/api/datasets
      params:
        search: "${{ args.query || '' }}"
        limit: "${{ args.limit }}"
        sort: "${{ args.sort }}"
        direction: "-1"

  - map:
      id: ${{ item.id }}
      title: ${{ item.id }}
      author: "${{ item.author || item.id.split('/')[0] || '' }}"
      downloads: "${{ item.downloads || 0 }}"
      likes: "${{ item.likes || 0 }}"
      createdAt: "${{ item.createdAt || '' }}"
      lastModified: "${{ item.lastModified || '' }}"
      tags: "${{ (item.tags || []).slice(0,8).join(', ') }}"
      url: "${{ 'https://huggingface.co/datasets/' + item.id }}"

  - limit: ${{ args.limit }}

columns: [id, author, downloads, likes, lastModified, url]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["http.fetch", "ai.search", "ai.artifacts"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
