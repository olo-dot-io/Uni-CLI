site: arxiv
name: search
description: Search arXiv papers
domain: export.arxiv.org
type: web-api
strategy: public
lint_listing_detail: skip

args:
  query:
    type: str
    required: true
    positional: true
    description: Search keyword
  limit:
    type: int
    default: 10
    description: Max results
  sort:
    type: str
    default: relevance
    choices: [relevance, submittedDate]
    description: Sort by relevance or newest submission

pipeline:
  - fetch_text:
      url: "https://export.arxiv.org/api/query"
      params:
        search_query: "all:${{ args.query }}"
        max_results: "${{ args.limit }}"
        sortBy: "${{ args.sort }}"
        sortOrder: descending

  - parse_rss:
      fields:
        id: id
        url: id
        title: title
        authors: author.name
        published: published
        summary: summary

  - limit: "${{ args.limit }}"

columns: [title, authors, published, id]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["http.fetch", "scholar.search", "ai.search", "ai.paper"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
