site: zhihu
name: articles
description: List articles by a Zhihu user
domain: www.zhihu.com
type: web-api
strategy: cookie
auth_cookies: [z_c0]

args:
  id:
    required: true
    positional: true
    description: User URL token (the `url_token` field of `zhihu user` and `zhihu search`)
    x-unicli-kind: id
    x-unicli-accepts: [url]
  limit:
    type: int
    default: 20
    description: Number of articles
  sort:
    type: str
    default: created
    enum: [created, voteups]
    description: Newest first (created) or most upvoted first (voteups)

pipeline:
  - fetch:
      url: https://www.zhihu.com/api/v4/members/${{ args.id }}/articles
      params:
        limit: "${{ args.limit }}"
        offset: "0"
        include: "data[*].voteup_count,comment_count,created,updated"
        sort_by: "${{ args.sort }}"

  - select: data

  - map:
      rank: ${{ index + 1 }}
      id: ${{ item.id }}
      title: ${{ item.title || '' }}
      created_at: ${{ item.created | date_iso }}
      updated_at: ${{ item.updated | date_iso }}
      excerpt: ${{ (item.excerpt || '') | strip_html | slice(0, 150) }}
      voteup: ${{ item.voteup_count || 0 }}
      comments: ${{ item.comment_count || 0 }}
      url: https://zhuanlan.zhihu.com/p/${{ item.id }}

  - limit: ${{ args.limit }}

columns:
  [rank, id, title, created_at, updated_at, excerpt, voteup, comments, url]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["http.fetch"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
