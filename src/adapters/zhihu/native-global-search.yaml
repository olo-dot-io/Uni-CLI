site: zhihu
name: native-global-search
description: Search current web sources through the official Zhihu CLI
type: bridge
strategy: public
binary: zhihu-cli
detect: which zhihu-cli
lint_listing_detail: skip

args:
  query:
    type: str
    required: true
    positional: true
    description: Search query
  count:
    type: int
    default: 10
    minimum: 1
    maximum: 20
    description: Number of results
  search_db:
    type: str
    default: all
    choices: [all, realtime, static]
    description: Official search index selection

pipeline:
  - exec:
      command: "${{ env.ZHIHU_CLI || (env.LOCALAPPDATA ? env.LOCALAPPDATA + '/ZhihuCLI/current/zhihu-cli.exe' : (env.ZHIHU_CLI_HOME || env.HOME + '/Library/Application Support/zhihu-cli') + '/current/zhihu-cli') }}"
      args:
        [
          search,
          global,
          --query,
          "${{ args.query }}",
          --count,
          "${{ args.count }}",
          --search-db,
          "${{ args.search_db }}",
        ]
      parse: json
      timeout: 30000

operation_effect: read
execution_operator: native-cli
operation_family: search
auth_requirement: required
retrieval:
  operation: discover
  result_kind: web-result
  source_class: search-index
  arguments:
    query: query
    limit: count
capabilities: [subprocess.exec]
executables: [zhihu-cli]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
