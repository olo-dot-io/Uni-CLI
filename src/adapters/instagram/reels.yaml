site: instagram
name: reels
description: Get Instagram trending reels
domain: www.instagram.com
type: web-api
strategy: cookie
auth_cookies: [sessionid, csrftoken]

args:
  limit:
    type: int
    default: 20

pipeline:
  - fetch:
      url: https://www.instagram.com/api/v1/clips/discover/
      headers:
        X-IG-App-ID: "936619743392459"
        User-Agent: "Instagram 219.0.0.12.117 Android"

  - select: items

  - map:
      author: "${{ item.media?.user?.username || '' }}"
      caption: "${{ (item.media?.caption?.text || '') | truncate(100) }}"
      plays: "${{ item.media?.play_count || 0 }}"
      likes: "${{ item.media?.like_count || 0 }}"

  - limit: ${{ args.limit }}

columns: [author, caption, plays, likes]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["http.fetch"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: true
quarantineReason: "2026-05-24: Instagram retired /api/v1/clips/trending/; /api/v1/clips/discover/ requires live authenticated browser validation before this web-api route can be trusted."
schema_version: v2
