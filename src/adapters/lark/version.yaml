site: lark
name: version
description: Check the official Lark/Feishu CLI version
type: bridge
strategy: public
binary: lark-cli
detect: which lark-cli

pipeline:
  - exec:
      command: lark-cli
      args:
        - --version
      parse: text
      timeout: 10000

columns: [output]

operation_effect: read
execution_operator: native-cli
operation_family: get
auth_requirement: none
capabilities: ["subprocess.exec"]
executables: [lark-cli]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
