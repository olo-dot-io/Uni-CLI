site: twitter
name: native-tweet
description: Read one X post through the official xurl CLI and X API
type: bridge
strategy: public
binary: xurl
detect: which xurl

args:
  id:
    type: str
    required: true
    positional: true
    pattern: "^[0-9]+$"
    description: Numeric X post ID

pipeline:
  - exec:
      command: xurl
      args:
        - "${{ '/2/tweets/' + args.id + '?tweet.fields=author_id,created_at,public_metrics,conversation_id,referenced_tweets&expansions=author_id,referenced_tweets.id&user.fields=username,name,verified' }}"
      parse: json
      timeout: 30000

operation_effect: read
execution_operator: native-cli
operation_family: get
auth_requirement: required
capabilities: [subprocess.exec]
executables: [xurl]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
