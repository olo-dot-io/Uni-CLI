site: hackernews
name: search
description: Search Hacker News stories
domain: news.ycombinator.com
type: web-api
strategy: public
operation_effect: read
browser: false

args:
  query:
    type: str
    required: true
    positional: true
    description: Search query
  limit:
    type: int
    default: 20
    description: Number of results
  sort:
    type: str
    default: relevance
    choices: [relevance, date]
    description: Sort by relevance or date

pipeline:
  - fetch:
      url: "https://hn.algolia.com/api/v1/${{ args.sort === 'date' ? 'search_by_date' : 'search' }}"
      params:
        query: ${{ args.query }}
        tags: story
        hitsPerPage: ${{ args.limit }}
        typoTolerance: false

  - select: hits

  - map:
      rank: ${{ index + 1 }}
      id: ${{ item.objectID }}
      title: ${{ item.title }}
      score: ${{ item.points }}
      author: ${{ item.author }}
      comments: ${{ item.num_comments }}
      created_at: ${{ item.created_at }}
      updated_at: ${{ item.updated_at }}
      external_url: ${{ item.url }}
      url: "${{ 'https://news.ycombinator.com/item?id=' + item.objectID }}"

columns: [rank, title, score, author, comments, created_at, updated_at, url]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
retrieval:
  operation: discover
  result_kind: community
  source_class: community
  arguments:
    query: query
    limit: limit
    sort: sort
capabilities: ["http.fetch"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
