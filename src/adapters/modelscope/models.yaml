site: modelscope
name: models
description: Search live ModelScope model metadata through the public OpenAPI
type: web-api
domain: modelscope.cn
strategy: public

args:
  query:
    type: str
    required: true
    positional: true
    description: Model name, organization, tag, or free-text query
  limit:
    type: int
    default: 20

pipeline:
  - fetch:
      url: https://modelscope.cn/openapi/v1/models
      params:
        search: ${{ args.query }}
        page_number: "1"
        page_size: ${{ args.limit }}

  - select: data.models

  - map:
      id: ${{ item.id }}
      title: "${{ item.display_name || item.id }}"
      description: "${{ item.description || '' }}"
      downloads: "${{ item.downloads || 0 }}"
      likes: "${{ item.likes || 0 }}"
      created_at: "${{ item.created_at || '' }}"
      updated_at: "${{ item.last_modified || '' }}"
      tags: "${{ (item.tags || []).slice(0, 12).join(', ') }}"
      url: "${{ 'https://modelscope.cn/models/' + item.id }}"

  - limit: ${{ args.limit }}

columns: [id, title, downloads, likes, updated_at, url]

retrieval:
  operation: discover
  result_kind: model
  source_class: hosted-artifact
  arguments:
    query: query
    limit: limit
capabilities: ["http.fetch"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
