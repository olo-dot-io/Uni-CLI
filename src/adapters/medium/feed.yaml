site: medium
name: feed
description: Medium trending articles by topic
operation_effect: read
domain: medium.com
type: web-api
strategy: public
lint_listing_detail: skip

args:
  topic:
    default: ""
    positional: true
    description: "Topic tag (e.g. technology, programming, ai)"
  limit:
    type: int
    default: 20
    description: Number of articles

pipeline:
  - fetch_text:
      url: "https://medium.com/feed/tag/${{ args.topic || 'technology' }}"
      headers:
        Accept: "application/rss+xml,application/xml"
        User-Agent: "Mozilla/5.0 (compatible; Uni-CLI)"

  - parse_rss: ~

  - map:
      title: ${{ item.title || '' }}
      summary: ${{ (item.description || '') | strip_html | truncate(180) }}
      published_at: ${{ item.pubDate || '' }}
      url: ${{ item.url || item.link || '' }}

  - limit: ${{ args.limit }}

columns: [title, published_at, summary, url]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["http.fetch"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
