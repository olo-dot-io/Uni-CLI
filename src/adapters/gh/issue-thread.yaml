site: gh
name: issue-thread
description: Read one GitHub issue with its complete structured comment thread
type: bridge
strategy: public
binary: gh
detect: which gh

args:
  ref:
    type: str
    required: true
    positional: true
    format: uri
    x-unicli-uri-origins: ["https://github.com"]
    x-unicli-uri-path-pattern: "/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/[1-9][0-9]*/?"
    description: Exact GitHub issue URL

pipeline:
  - exec:
      command: gh
      args:
        - issue
        - view
        - ${{ args.ref }}
        - --json
        - author,body,closed,closedAt,comments,createdAt,id,labels,milestone,number,reactionGroups,state,stateReason,title,updatedAt,url
      parse: json
      timeout: 30000

columns: [number, title, state, author, createdAt, updatedAt, url, comments]

capabilities: ["subprocess.exec", "auth.executable.gh"]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
