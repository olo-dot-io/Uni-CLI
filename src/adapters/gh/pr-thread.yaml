site: gh
name: pr-thread
description: Read one GitHub pull request with comments, reviews, files, commits, checks, and merge state
type: bridge
strategy: public
binary: gh
detect: which gh

args:
  ref:
    type: str
    required: true
    positional: true
    description: GitHub pull-request URL or OWNER/REPO#NUMBER reference

pipeline:
  - exec:
      command: gh
      args:
        - pr
        - view
        - ${{ args.ref }}
        - --json
        - additions,author,baseRefName,baseRefOid,body,changedFiles,closed,closedAt,comments,commits,createdAt,deletions,files,headRefName,headRefOid,isDraft,labels,latestReviews,mergeCommit,mergeStateStatus,mergeable,mergedAt,mergedBy,number,reviewDecision,reviews,state,statusCheckRollup,title,updatedAt,url
      parse: json
      timeout: 30000

columns:
  [
    number,
    title,
    state,
    author,
    reviewDecision,
    mergeable,
    createdAt,
    updatedAt,
    url,
  ]

capabilities: ["subprocess.exec", "auth.executable.gh", "ai.read", "ai.thread"]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
