site: gh
name: pr-thread
description: Read one GitHub pull request with comments, reviews, files, commits, checks, and merge state
type: bridge
strategy: public
binary: gh
detect: which gh

args:
  ref:
    type: str
    required: true
    positional: true
    format: uri
    x-unicli-uri-origins: ["https://github.com"]
    x-unicli-uri-path-pattern: "/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/pull/[1-9][0-9]*/?"
    description: Exact GitHub pull-request URL

pipeline:
  - exec:
      command: gh
      args:
        - pr
        - view
        - ${{ args.ref }}
        - --json
        - additions,author,baseRefName,baseRefOid,body,changedFiles,closed,closedAt,comments,commits,createdAt,deletions,files,headRefName,headRefOid,isDraft,labels,latestReviews,mergeCommit,mergeStateStatus,mergeable,mergedAt,mergedBy,number,reviewDecision,reviews,state,statusCheckRollup,title,updatedAt,url
      parse: json
      timeout: 30000

columns:
  [
    number,
    title,
    state,
    author,
    reviewDecision,
    mergeable,
    createdAt,
    updatedAt,
    url,
  ]

capabilities: ["subprocess.exec", "auth.executable.gh"]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
