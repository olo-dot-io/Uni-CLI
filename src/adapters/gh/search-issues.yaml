site: gh
name: search-issues
description: Search current GitHub issues across repositories
type: bridge
strategy: public
lint_listing_detail: skip
binary: gh
detect: which gh

args:
  query:
    type: str
    required: true
    positional: true
    description: GitHub issue search query; raw qualifiers such as repo:OWNER/REPO are supported
  limit:
    type: int
    default: 20

pipeline:
  - exec:
      command: gh
      args:
        - search
        - issues
        - ${{ args.query }}
        - --limit
        - ${{ args.limit }}
        - --json
        - number,title,state,author,createdAt,updatedAt,url,repository,body,commentsCount
        - --sort
        - updated
        - --order
        - desc
        - --visibility
        - public
      parse: json
      timeout: 30000

  - map:
      id: ${{ item.id || item.number }}
      number: ${{ item.number }}
      title: ${{ item.title }}
      state: ${{ item.state }}
      author: "${{ item.author ? item.author.login : '' }}"
      repository: "${{ item.repository ? item.repository.nameWithOwner : '' }}"
      createdAt: ${{ item.createdAt }}
      updatedAt: ${{ item.updatedAt }}
      comments: ${{ item.commentsCount }}
      summary: "${{ (item.body || '').slice(0,4000) }}"
      url: ${{ item.url }}

columns: [repository, number, title, state, author, updatedAt, comments, url]

capabilities:
  ["subprocess.exec", "auth.executable.gh", "ai.search", "ai.community"]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
