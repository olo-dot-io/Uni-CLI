site: gh
name: repo
description: Inspect a GitHub repository's stack, topics, activity, license, counts, release, and default branch
operation_effect: read
type: bridge
strategy: public
binary: gh
detect: which gh

pipeline:
  - exec:
      command: gh
      args:
        - repo
        - view
        - ${{ args.repo }}
        - --json
        - nameWithOwner,description,homepageUrl,url,visibility,isArchived,isEmpty,isFork,isMirror,isPrivate,isTemplate,createdAt,updatedAt,pushedAt,stargazerCount,forkCount,watchers,primaryLanguage,languages,licenseInfo,repositoryTopics,defaultBranchRef,latestRelease,issues,pullRequests,hasDiscussionsEnabled,hasIssuesEnabled,hasProjectsEnabled,hasWikiEnabled,securityPolicyUrl
      parse: json
      timeout: 30000

  - map:
      fullName: ${{ item.nameWithOwner }}
      description: ${{ item.description || '' }}
      homepage: ${{ item.homepageUrl || '' }}
      visibility: ${{ item.visibility }}
      archived: ${{ item.isArchived }}
      empty: ${{ item.isEmpty }}
      fork: ${{ item.isFork }}
      mirror: ${{ item.isMirror }}
      private: ${{ item.isPrivate }}
      template: ${{ item.isTemplate }}
      createdAt: ${{ item.createdAt }}
      updatedAt: ${{ item.updatedAt }}
      pushedAt: ${{ item.pushedAt }}
      stargazerCount: ${{ item.stargazerCount }}
      forkCount: ${{ item.forkCount }}
      watcherCount: "${{ item.watchers ? item.watchers.totalCount : 0 }}"
      primaryLanguage: "${{ item.primaryLanguage ? item.primaryLanguage.name : '' }}"
      languages: "${{ JSON.stringify(item.languages || []) }}"
      topics: "${{ JSON.stringify(item.repositoryTopics || []) }}"
      license: "${{ item.licenseInfo ? item.licenseInfo.key : '' }}"
      defaultBranch: "${{ item.defaultBranchRef ? item.defaultBranchRef.name : '' }}"
      latestRelease: "${{ JSON.stringify(item.latestRelease || null) }}"
      issueCount: "${{ item.issues ? item.issues.totalCount : 0 }}"
      pullRequestCount: "${{ item.pullRequests ? item.pullRequests.totalCount : 0 }}"
      discussionsEnabled: ${{ item.hasDiscussionsEnabled }}
      issuesEnabled: ${{ item.hasIssuesEnabled }}
      projectsEnabled: ${{ item.hasProjectsEnabled }}
      wikiEnabled: ${{ item.hasWikiEnabled }}
      securityPolicyUrl: ${{ item.securityPolicyUrl || '' }}
      url: ${{ item.url }}

args:
  repo:
    type: str
    required: true
    positional: true
    pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    description: Repository in OWNER/REPO form

columns:
  [
    fullName,
    description,
    primaryLanguage,
    topics,
    stargazerCount,
    forkCount,
    issueCount,
    pullRequestCount,
    pushedAt,
    latestRelease,
    url,
  ]

capabilities: ["subprocess.exec", "auth.executable.gh"]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
