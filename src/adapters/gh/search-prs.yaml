site: gh
name: search-prs
description: Search GitHub pull requests for a feature, implementation, author, review, branch, or repository
type: bridge
strategy: public
operation_effect: read
lint_listing_detail: skip
binary: gh
detect: which gh

args:
  query:
    type: str
    required: true
    positional: true
    minLength: 1
    description: Pull-request phrase or raw GitHub PR qualifiers
  repo:
    type: str
    default: ""
    pattern: "^$|^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    description: Optional repository in OWNER/REPO form
  owner:
    type: str
    default: ""
    description: Optional repository owner
  author:
    type: str
    default: ""
    description: Optional pull-request author login
  state:
    type: str
    default: any
    choices: [any, open, closed]
  label:
    type: str
    default: ""
    description: Exact pull-request label
  base:
    type: str
    default: ""
    description: Base branch
  head:
    type: str
    default: ""
    description: Head branch
  match:
    type: str
    default: any
    choices: [any, title, body, comments]
  sort:
    type: str
    default: updated
    choices:
      [
        comments,
        created,
        interactions,
        reactions,
        reactions-+1,
        reactions--1,
        reactions-heart,
        reactions-smile,
        reactions-tada,
        reactions-thinking_face,
        updated,
      ]
  order:
    type: str
    default: desc
    choices: [asc, desc]
  limit:
    type: int
    default: 20
    minimum: 1
    maximum: 100

pipeline:
  - exec:
      command: gh
      args:
        - search
        - prs
        - ${{ args.query }}
        - "${{ args.repo ? '--repo=' + args.repo : '' }}"
        - "${{ args.owner ? '--owner=' + args.owner : '' }}"
        - "${{ args.author ? '--author=' + args.author : '' }}"
        - "${{ args.state !== 'any' ? '--state=' + args.state : '' }}"
        - "${{ args.label ? '--label=' + args.label : '' }}"
        - "${{ args.base ? '--base=' + args.base : '' }}"
        - "${{ args.head ? '--head=' + args.head : '' }}"
        - "${{ args.match !== 'any' ? '--match=' + args.match : '' }}"
        - --limit
        - ${{ args.limit }}
        - --json
        - number,title,state,author,createdAt,updatedAt,closedAt,url,repository,body,commentsCount,isDraft,labels,isLocked
        - --sort
        - ${{ args.sort }}
        - --order
        - ${{ args.order }}
        - --visibility
        - public
      parse: json
      timeout: 30000

  - map:
      id: ${{ item.id || item.number }}
      number: ${{ item.number }}
      title: ${{ item.title }}
      state: ${{ item.state }}
      draft: ${{ item.isDraft }}
      author: "${{ item.author ? item.author.login : '' }}"
      repository: "${{ item.repository ? item.repository.nameWithOwner : '' }}"
      createdAt: ${{ item.createdAt }}
      updatedAt: ${{ item.updatedAt }}
      closedAt: ${{ item.closedAt }}
      comments: ${{ item.commentsCount }}
      labels: "${{ JSON.stringify(item.labels || []) }}"
      locked: ${{ item.isLocked }}
      summary: "${{ (item.body || '').slice(0,4000) }}"
      url: ${{ item.url }}

columns:
  [repository, number, title, state, draft, author, updatedAt, comments, url]

retrieval:
  operation: discover
  result_kind: pull-request
  source_class: hosted-artifact
  arguments:
    query: query
    limit: limit
    repository: repo
    owner: owner
    author: author
capabilities: ["subprocess.exec", "auth.executable.gh"]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
