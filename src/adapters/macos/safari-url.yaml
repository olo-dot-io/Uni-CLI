site: macos
name: safari-url
description: Get the URL and title of the active Safari tab
type: desktop
binary: osascript
detect: "test $(uname) = Darwin"

pipeline:
  - exec:
      command: osascript
      args:
        - "-l"
        - "JavaScript"
        - "-e"
        - |
          const app = Application('Safari');
          const windows = app.windows();
          if (windows.length === 0) {
            JSON.stringify([{ state: 'no_window', url: '', title: '' }]);
          } else {
            const tab = windows[0].currentTab();
            JSON.stringify([{ state: 'ok', url: tab.url(), title: tab.name() }]);
          }
      parse: json

columns: [state, url, title]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["subprocess.exec"]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
