# Desktop adapter — take a macOS screenshot via screencapture
site: macos
name: screenshot
description: Take a screenshot and save to file or clipboard
type: desktop
binary: screencapture
detect: "test $(uname) = Darwin"

args:
  file:
    type: str
    default: "/tmp/screenshot.png"
    description: Output file path for the screenshot
    x-unicli-kind: path
  clipboard:
    type: bool
    default: false
    description: Copy screenshot to clipboard instead of saving to file

pipeline:
  - if: "args.clipboard"
    then:
      - exec:
          command: screencapture
          args: ["-x", "-c"]
          timeout: 10000
      - map:
          output: clipboard
          message: Screenshot copied to clipboard
    else:
      - exec:
          command: screencapture
          args: ["-x", "${{ args.file }}"]
          timeout: 10000
      - map:
          output: "${{ args.file }}"
          message: Screenshot saved

columns: [output, message]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["subprocess.exec"]
minimum_capability: subprocess.exec
target_surface: system
operation_effect: local_file
operation_family: capture
execution_operator: native-cli
idempotency: conditional
trust: user
confidentiality: public
quarantine: false
schema_version: v2
