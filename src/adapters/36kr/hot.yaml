site: 36kr
name: hot
description: 36Kr hot/trending articles
operation_effect: read
domain: 36kr.com
type: web-api
strategy: public
lint_listing_detail: skip

args:
  limit:
    type: int
    default: 20
    description: Number of articles

pipeline:
  - fetch:
      url: https://gateway.36kr.com/api/mis/nav/home/nav/rank/hot
      method: POST
      body:
        partner_id: wap
        param:
          siteId: 1
          platformId: 2
      headers:
        Content-Type: application/json; charset=utf-8

  - select: data.hotRankList

  - map:
      rank: ${{ index + 1 }}
      title: ${{ item.templateMaterial?.widgetTitle || '' }}
      date: ${{ item.publishTime || '' }}
      author: ${{ item.templateMaterial?.authorName || '' }}
      reads: ${{ item.templateMaterial?.statRead || 0 }}
      id: ${{ item.itemId }}
      url: "${{ item.itemId ? 'https://www.36kr.com/p/' + item.itemId : '' }}"

  - limit: ${{ args.limit }}

columns: [rank, title, date, author, reads, id, url]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["http.fetch"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
