site: stackoverflow
name: search
description: Search Stack Overflow questions
domain: stackoverflow.com
type: web-api
strategy: public
lint_listing_detail: skip

args:
  query:
    type: str
    required: true
    positional: true
    description: Search query
  limit:
    type: int
    default: 10
    description: Max number of results
  sort:
    type: str
    default: relevance
    choices: [relevance, activity, creation]
    description: Sort by relevance, latest activity, or creation time

pipeline:
  - fetch:
      url: https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=${{ args.sort }}&q=${{ args.query | urlencode }}&site=stackoverflow

  - select: items

  - map:
      title: ${{ item.title }}
      score: ${{ item.score }}
      answers: ${{ item.answer_count }}
      created_at: ${{ item.creation_date }}
      updated_at: ${{ item.last_activity_date }}
      url: ${{ item.link }}

  - limit: ${{ args.limit }}

columns: [title, score, answers, created_at, updated_at, url]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
capabilities: ["http.fetch", "ai.search", "ai.community"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
