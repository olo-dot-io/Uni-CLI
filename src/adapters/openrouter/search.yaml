site: openrouter
name: search
description: Search OpenRouter AI models
type: web-api
domain: openrouter.ai
strategy: public
lint_listing_detail: skip

args:
  query:
    type: str
    positional: true
    description: Search query (model name, provider)

pipeline:
  - fetch:
      url: https://openrouter.ai/api/v1/models

  - select: data

  - filter: "!args.query || item.name.toLowerCase().includes(args.query.toLowerCase()) || item.id.toLowerCase().includes(args.query.toLowerCase())"

  - map:
      id: ${{ item.id }}
      name: ${{ item.name }}
      context: "${{ item.context_length || '' }}"
      prompt_price: "${{ item.pricing?.prompt || '' }}"
      completion_price: "${{ item.pricing?.completion || '' }}"
      url: "${{ 'https://openrouter.ai/' + item.id }}"

  - limit: 20

columns: [id, name, context, prompt_price, completion_price, url]

# schema-v2 metadata — injected by `unicli migrate schema-v2`
retrieval:
  operation: discover
  result_kind: model
  source_class: hosted-artifact
  arguments:
    query: query
capabilities: ["http.fetch"]
minimum_capability: http.fetch
trust: public
confidentiality: public
quarantine: false
schema_version: v2
