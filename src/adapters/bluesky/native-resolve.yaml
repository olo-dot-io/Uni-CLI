site: bluesky
name: native-resolve
description: Resolve an AT Protocol handle through Bluesky's official goat CLI
type: bridge
strategy: public
binary: goat
detect: which goat

args:
  handle:
    type: str
    required: true
    positional: true
    description: AT Protocol handle

pipeline:
  - exec:
      command: goat
      args: [resolve, "${{ args.handle }}"]
      parse: json
      timeout: 30000

operation_effect: read
execution_operator: native-cli
operation_family: get
auth_requirement: none
capabilities: [subprocess.exec]
executables: [goat]
minimum_capability: subprocess.exec
trust: user
confidentiality: public
quarantine: false
schema_version: v2
