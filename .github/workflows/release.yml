name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.215.1)"
        required: true

# IMPORTANT: permissions are declared at the JOB level, not workflow level.
# A workflow-level `id-token: write` would issue an OIDC token to every job
# in the file (none today, but future verify / lint jobs shouldn't inherit
# publish-grade trust). Scope the narrow powers to the publish job only.
permissions: {}

jobs:
  build-process-owner:
    name: Build Windows process owner (${{ matrix.arch }})
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust 1.82.0
        run: |
          rustup toolchain install 1.82.0 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.82.0

      - name: Build process owner
        run: cargo build --locked -p unicli-process-owner --profile release-sidecar --target "${{ matrix.target }}"

      - name: Upload process owner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: process-owner-win32-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release-sidecar/unicli-process-owner.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-process-owner
    environment:
      # The `npm-publish` environment gates NPM_TOKEN (fallback) access and
      # is the exact tuple npmjs.com Trusted Publishers expects: the
      # (org, repo, workflow, environment) 4-tuple must match the config at
      # https://www.npmjs.com/package/@zenalexa/unicli > Settings > Trusted
      # Publishers. Mismatch → OIDC verify fails and npm prints a clear error.
      name: npm-publish
      url: https://www.npmjs.com/package/@zenalexa/unicli
    permissions:
      contents: write # softprops/action-gh-release creates the GitHub Release
      id-token: write # required for OIDC provenance + Trusted Publishers
    steps:
      # Pinned to a commit SHA (not a tag) so a compromised actions tag can't
      # silently swap a malicious version into the publish path. Bumped via
      # Renovate / Dependabot with SHA updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download x64 process owner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: process-owner-win32-x64
          path: packages/sidecars/unicli-process-owner-win32-x64

      - name: Download arm64 process owner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: process-owner-win32-arm64
          path: packages/sidecars/unicli-process-owner-win32-arm64

      - name: Verify bundled process owners
        run: |
          node <<'NODE'
          const { copyFileSync, mkdirSync, openSync, closeSync, readSync, statSync } = require("node:fs");
          const binaries = [
            ["x64", "packages/sidecars/unicli-process-owner-win32-x64/unicli-process-owner.exe"],
            ["arm64", "packages/sidecars/unicli-process-owner-win32-arm64/unicli-process-owner.exe"],
          ];
          mkdirSync("release-assets", { recursive: true });
          for (const [arch, path] of binaries) {
            if (statSync(path).size < 4096) throw new Error(`${path} is implausibly small`);
            const descriptor = openSync(path, "r");
            const magic = Buffer.alloc(2);
            try {
              readSync(descriptor, magic, 0, magic.length, 0);
            } finally {
              closeSync(descriptor);
            }
            if (magic.toString("ascii") !== "MZ") throw new Error(`${path} is not a PE executable`);
            copyFileSync(path, `release-assets/unicli-process-owner-win32-${arch}.exe`);
          }
          NODE

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 LTS ships npm 11.x out of the box, which is required for
          # the Trusted Publishers OIDC token-exchange flow (npm 11.5.1+).
          # Staying on Node 22 pinned us to npm 10.9, which fell back to
          # the empty NODE_AUTH_TOKEN path and failed ENEEDAUTH.
          # Earlier attempts to upgrade npm in-place (`npm i -g npm@latest`)
          # or via Corepack both failed on the runner — the former with a
          # transient "Cannot find module 'promise-retry'", the latter
          # because the corepack shim doesn't override the Node toolcache's
          # bin in PATH. Bumping Node is the least-surprising fix.
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Report npm + node versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev

      # Full tests and platform matrices run before tagging. The release job
      # rebuilds the exact package and keeps only fast, package-facing gates so
      # publishing does not repeat the entire suite.
      - name: Build and verify release package
        run: |
          npm run lint
          npm run build:release
          npm run bench:product-surface:check
          npm audit --omit=dev --audit-level=moderate

      - name: Validate release metadata
        id: release_metadata
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_REQUIRE_CODENAME=1 npm run release:check
          node <<'NODE'
          const fs = require("node:fs");
          const version = require("./package.json").version;
          const expectedTag = `v${version}`;
          const requestedTag = process.env.REQUESTED_TAG;
          if (requestedTag && requestedTag !== expectedTag) {
            console.error(`Release tag/version mismatch: tag ${requestedTag} does not match package version ${expectedTag}`);
            process.exit(1);
          }
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const heading = changelog.match(new RegExp(`^## \\[${escaped}\\].*$`, "m"))?.[0] ?? "";
          if (!heading || !/—\s+\S.+\s·\s\S.+/.test(heading) || /\b(?:tbd|todo|unreleased|next)\b/i.test(heading)) {
            console.error(`Release metadata is missing final Program · Astronaut codename for v${version}: ${heading || "missing heading"}`);
            process.exit(1);
          }
          const title = heading.replace(/^## \[([^\]]+)\]\s+—\s+/, "v$1 — ");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${expectedTag}\n`);
          NODE

      # Surface which auth path the publish will take BEFORE it runs so a
      # failure is debuggable from the log without digging into npm client
      # internals. With Trusted Publishers configured on npmjs.com, npm
      # prefers the OIDC path and ignores NODE_AUTH_TOKEN. Without TP, npm
      # falls back to the token — still provenance-signed, still authenticated,
      # just not keyless.
      - name: Report publish auth mode
        env:
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "${HAS_NPM_TOKEN}" = "true" ]; then
            echo "::notice title=npm auth::NPM_TOKEN secret detected — will be used as a fallback if OIDC Trusted Publishers is not configured on npmjs.com"
          else
            echo "::notice title=npm auth::No NPM_TOKEN secret — publish MUST succeed via OIDC Trusted Publishers (npmjs.com > Settings > Trusted Publishers)"
          fi

      - name: Pack dry run
        run: npm pack --dry-run

      # --provenance attaches a signed SLSA v1 attestation to the tarball.
      # --access public is required for scoped packages (@zenalexa/*).
      # NODE_AUTH_TOKEN is ONLY consumed when the Trusted Publishers OIDC
      # path isn't available; set it via the `npm-publish` environment
      # secret if and only if TP is not configured yet.
      # Prerelease (e.g. 0.216.0-beta.2) requires --tag: npm otherwise
      # refuses to publish, because without a non-latest dist-tag the new
      # version would be `npm install @zenalexa/unicli` → prerelease, which
      # is hostile to users who didn't opt in. Stable versions publish to
      # `latest` implicitly.
      - name: Publish to npm with provenance
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@zenalexa/unicli@$VERSION" version >/dev/null 2>&1; then
            echo "::notice title=npm publish::@zenalexa/unicli@$VERSION already exists — skipping npm publish"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            # Semver prerelease: extract channel from "0.216.0-beta.2" → "beta"
            CHANNEL=$(echo "$VERSION" | sed -E 's/^[^-]+-([^.]+).*/\1/')
            echo "::notice title=npm dist-tag::prerelease $VERSION → --tag $CHANNEL"
            npm publish --provenance --access public --tag "$CHANNEL"
          else
            echo "::notice title=npm dist-tag::stable $VERSION → --tag latest (implicit)"
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          name: ${{ steps.release_metadata.outputs.title }}
          prerelease: ${{ contains(steps.release_metadata.outputs.tag, '-') }}
          tag_name: ${{ steps.release_metadata.outputs.tag }}
          files: release-assets/*.exe
          fail_on_unmatched_files: true
