name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    timeout-minutes: 15
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          bash scripts/check-commit-msg.sh "$RUNNER_TEMP/pr-title.txt"

  verify:
    timeout-minutes: 30
    name: Verify (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            profile: full
          - os: ubuntu-latest
            node-version: 24
            profile: node-compat
          - os: ubuntu-latest
            node-version: 26
            profile: node-compat
          - os: windows-latest
            node-version: 22
            profile: windows-smoke
          - os: macos-14
            node-version: 22
            profile: macos-smoke

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install repository Rust toolchain
        if: matrix.profile == 'windows-smoke'
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          export RUSTUP_TOOLCHAIN="$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"

      - name: Build Windows process owner
        if: matrix.profile == 'windows-smoke'
        shell: pwsh
        run: |
          cargo build --locked -p unicli-process-owner
          "UNICLI_PROCESS_OWNER=$PWD\\target\\debug\\unicli-process-owner.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Context lint
        if: matrix.profile == 'full'
        run: npm run lint:context

      - name: Build search manifest
        run: npm run build:manifest

      - name: Lint adapters (schema-v2)
        if: matrix.profile == 'full'
        run: npm run lint:adapters

      - name: Build
        run: npm run build

      - name: Unit tests
        if: matrix.profile == 'full' || matrix.profile == 'node-compat' || matrix.profile == 'windows-smoke'
        run: npm run test

      - name: Windows native host integration
        if: matrix.profile == 'windows-smoke'
        run: npx vitest run --project integration tests/integration/browser-native-host.test.ts --maxWorkers=1 --reporter=dot

      - name: Integration tests
        if: matrix.profile == 'full' || matrix.profile == 'node-compat'
        run: npm run test:integration

      - name: Production dependency audit
        if: matrix.profile == 'node-compat'
        run: npm audit --omit=dev --audit-level=moderate

      - name: Compute snapshot coverage
        if: matrix.profile == 'full'
        run: npm run coverage:compute-snapshot

      - name: Compute perf tests
        if: matrix.profile == 'full'
        run: |
          observation_root=$(mktemp -d /dev/shm/unicli-perf.XXXXXX)
          trap 'rm -rf "$observation_root"' EXIT
          UNICLI_VISUAL_OBSERVATION_ROOT="$observation_root" npm run test:perf

      - name: Stats consistency gate
        if: matrix.profile == 'full'
        run: npm run stats:check

      - name: Release truth consistency gate
        if: matrix.profile == 'full'
        run: npm run truth:check

  rust-sidecars:
    timeout-minutes: 30
    name: Rust Sidecars (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          export RUSTUP_TOOLCHAIN="$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target "${{ matrix.target }}"
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"

      - name: Install Linux accessibility tooling
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::ForceIPv4=true update &&
              sudo apt-get -o Acquire::ForceIPv4=true install -y libatspi2.0-dev xdotool ydotool wtype &&
              exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target "${{ matrix.target }}" -- -D warnings

      - name: Test
        if: matrix.target != 'aarch64-pc-windows-msvc'
        run: cargo test --workspace --target "${{ matrix.target }}"

      - name: Build sidecars
        run: cargo build --workspace --profile release-sidecar --target "${{ matrix.target }}"

      - name: Upload sidecar artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecars-${{ matrix.target }}
          retention-days: 3
          path: |
            target/${{ matrix.target }}/release-sidecar/unicli-process-owner*
            target/${{ matrix.target }}/release-sidecar/unicli-uia*
            target/${{ matrix.target }}/release-sidecar/unicli-atspi*

  rust-sidecars-extended:
    timeout-minutes: 30
    name: Rust Sidecars Extended (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          export RUSTUP_TOOLCHAIN="$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target "${{ matrix.target }}"
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"

      - name: Install Linux accessibility tooling
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::ForceIPv4=true update &&
              sudo apt-get -o Acquire::ForceIPv4=true install -y libatspi2.0-dev xdotool ydotool wtype &&
              exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target "${{ matrix.target }}" -- -D warnings

      - name: Test
        if: matrix.target != 'aarch64-pc-windows-msvc'
        run: cargo test --workspace --target "${{ matrix.target }}"

      - name: Build sidecars
        run: cargo build --workspace --profile release-sidecar --target "${{ matrix.target }}"

      - name: Upload sidecar artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidecars-extended-${{ matrix.target }}
          retention-days: 3
          path: |
            target/${{ matrix.target }}/release-sidecar/unicli-process-owner*
            target/${{ matrix.target }}/release-sidecar/unicli-uia*
            target/${{ matrix.target }}/release-sidecar/unicli-atspi*

  adapter-health:
    timeout-minutes: 15
    name: Adapter Health (PR signal)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request'
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build search manifest
        run: npm run build:manifest

      - name: Run adapter health probe
        env:
          HEALTH_TIMEOUT_MS: "8000"
        run: npm run adapter:health

  adapter-health-strict:
    timeout-minutes: 15
    name: Adapter Health (spec gate)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build search manifest
        run: npm run build:manifest

      - name: Run adapter health probe (strict, retry=2)
        env:
          HEALTH_TIMEOUT_MS: "8000"
          HEALTH_RETRY: "2"
        run: |
          attempts=0
          max=2
          until npm run adapter:health; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max" ]; then
              echo "adapter-health-strict: failed after $attempts attempts" >&2
              exit 1
            fi
            echo "adapter-health-strict: attempt $attempts failed, retrying..." >&2
            sleep 10
          done

  verify-changesets:
    timeout-minutes: 15
    name: Verify Changesets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify changeset present for src/ changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          npm run verify:changesets

  conformance:
    timeout-minutes: 15
    name: Scheduled Conformance
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run conformance report
        id: conformance
        run: npm run conformance

      - name: Upload conformance artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report-${{ github.run_id }}
          path: conformance-report.json
          retention-days: 7

      - name: Summarize failures
        if: failure()
        run: |
          {
            echo "## Conformance failures"
            echo ""
            node -e "
            const r = require('./conformance-report.json');
            const failed = r.results.filter(x => x.status === 'fail');
            for (const f of failed) {
              console.log('- \`' + f.file + '\` — ' + f.errors.join('; '));
            }
            "
          } >> "$GITHUB_STEP_SUMMARY"

  benchmark-evidence:
    timeout-minutes: 15
    name: Scheduled Fixture Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build current CLI
        run: npm run build

      - name: Measure cold subprocess and fixture adapter boundaries
        env:
          BENCH_FIXTURES_ONLY: "1"
          BENCH_RUNS: "20"
        run: npm run bench

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-evidence-${{ github.run_id }}
          path: |
            bench/results.json
            docs/BENCHMARK.md
          retention-days: 7
