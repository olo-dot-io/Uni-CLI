[workspace]
resolver = "2"
members = [
  "crates/unicli-shared",
  "crates/unicli-uia",
  "crates/unicli-atspi",
  "crates/unicli-process-owner",
]

[workspace.package]
version = "0.218.0"
edition = "2021"
rust-version = "1.98.1"
license = "Apache-2.0"
homepage = "https://github.com/olo-dot-io/Uni-CLI"
repository = "https://github.com/olo-dot-io/Uni-CLI"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
windows = "0.62.2"
unicli-shared = { path = "crates/unicli-shared" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-sidecar]
inherits = "release"
panic = "unwind"

[profile.ci]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false
debug = 1
